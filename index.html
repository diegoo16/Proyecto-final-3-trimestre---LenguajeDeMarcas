<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BurgerCRM</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">

      <div class="sidebar__logo">
        <div class="sidebar__logo-title">BurgerCRM</div>
        <div class="sidebar__logo-sub">Sistema de Gestión</div>
      </div>

      <div class="sidebar__nav">

        <a href="index.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item sidebar__nav-item--active">
            <p>Dashboard</p>
          </div>
        </a>

        <a href="clientes.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item">
            <p>Clientes</p>
          </div>
        </a>

        <a href="productos.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item">
            <p>Productos</p>
          </div>
        </a>

        <a href="usuarios.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item">
            <p>Usuarios</p>
          </div>
        </a>

        <a href="ventas.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item">
            <p>Ventas</p>
          </div>
        </a>

        <a href="detalles.html" class="sidebar__nav-link">
          <div class="sidebar__nav-item">
            <p>Detalle Venta</p>
          </div>
        </a>

      </div>

      <div class="sidebar__footer">
        BurgerCRM v1.0 · 1º DAM
      </div>

    </nav>

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar__left">

        <button class="topbar__hamburger" onclick="toggleSidebar()">
          ☰
        </button>

        <span class="topbar__title">
          Dashboard
        </span>

      </div>

    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- DASHBOARD -->
      <section class="page page--active">

        <h2 class="section-title">
          Últimas Ventas
        </h2>

        <div class="table-wrap">

          <table class="table">

            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Comercial</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody>

              <tr>
                <td>#1</td>
                <td>Carlos</td>
                <td>Laura</td>
                <td>12/05/2026</td>
                <td>Completada</td>
                <td>25€</td>
              </tr>

              <tr>
                <td>#2</td>
                <td>Ana</td>
                <td>Pedro</td>
                <td>11/05/2026</td>
                <td>Pendiente</td>
                <td>18€</td>
              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>

  <script>
    const toggleSidebar = () => {
      document.getElementById("sidebar").classList.toggle("sidebar--open");
    };
  </script>

</body>

</html>
